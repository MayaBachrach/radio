name: Check live radio player
on:
  push:
    paths:
      - .github/workflows/radio-browser-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate live website
        run: node scripts/browser-smoke.mjs
      - name: Save results for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radio-browser-smoke
          path: artifacts/
