name: Check live radio player
on:
  push:
    paths:
      - .github/workflows/radio-browser-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright client
        run: npm install --no-save playwright@1.56.1
      - name: Validate live website
        run: node scripts/browser-smoke.mjs
      - name: Save results for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radio-browser-smoke
          path: artifacts/
