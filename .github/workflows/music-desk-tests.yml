name: Validate MAYU music desk
on:
  push:
    paths:
      - 'studio.html'
      - 'studio.css'
      - 'studio.js'
      - 'tools/**'
      - 'tests/**'
      - 'extension/audio.js'
      - '.github/workflows/airtime.yml'
      - '.github/workflows/music-desk-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run request authorization and scheduling tests
        run: python -m unittest discover -s tests -v
      - name: Verify Javascript syntax
        run: |
          node --check studio.js
          node --check extension/audio.js
      - name: Validate workflow YAML
        run: |
          python -m pip install --quiet pyyaml
          python -c "import yaml; yaml.safe_load(open('.github/workflows/airtime.yml',encoding='utf-8')); print('Action YAML parsed')"
