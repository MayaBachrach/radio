name: Package and test radio clients
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: desktop
      - run: npx --no-install install-electron
        working-directory: desktop
      - name: Assemble portable Windows player
        shell: pwsh
        run: |
          $bundle = "desktop/node_modules/electron/dist"
          $app = "$bundle/resources/app"
          New-Item -Type Directory "$app/desktop" -Force
          Copy-Item index.html $app
          Copy-Item extension "$app/extension" -Recurse
          Copy-Item desktop/*.cjs "$app/desktop"
          '{"name":"mayu-radio","version":"1.0.0","main":"desktop/main.cjs"}' | Set-Content "$app/package.json"
          Rename-Item "$bundle/electron.exe" "MAYU ET AL.exe"
          Compress-Archive "$bundle/*" MAYU-Windows.zip
          Rename-Item "$bundle/MAYU ET AL.exe" electron.exe
          Compress-Archive extension/* MAYU-Chrome.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MAYU-clients
          path: MAYU-*.zip
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - run: mkdir artifacts
      - run: node scripts/platform-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-screenshots
          path: artifacts/
