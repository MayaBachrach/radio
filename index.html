<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>RADIO 001</title>
  <style>
    :root { --player-scale: 2; }
    html, body { width:100%; min-height:100%; margin:0; background:#000; }
    body { min-height:100dvh; display:grid; place-items:center; overflow:hidden; }
    /* Entire page = the two actual Winamp windows; no additional site chrome. */
    #player { position:relative; width:275px; height:232px; transform:scale(var(--player-scale)); transform-origin:center; }
    #status { position:absolute; top:245px; left:-10px; width:295px; font:11px Arial,sans-serif; text-align:center; color:#ddd; line-height:1.4; }
    #status:empty { display:none; }
    /* Hide Winamp exit/minimize/shade controls without touching the skin artwork. */
    #webamp #close, #webamp #minimize, #webamp #shade,
    #webamp #equalizer-close, #webamp #equalizer-shade { display:none!important; }
    /* Keep the page as a fixed two-window radio, while other controls remain native. */
    #webamp #playlist-button, #webamp #equalizer-button, #webamp #option-context,
    #webamp #title-bar, #webamp .equalizer-top { pointer-events:none!important; }
    #webamp #playlist-window { display:none!important; }
    /* The provided skin also paints X glyphs directly into its title artwork.
       Mask only the tiny close-glyph pixels; preserve the remaining original artwork. */
    #webamp #title-bar::after {
      content:""; position:absolute; z-index:50; pointer-events:none;
      left:263px; top:3px; width:11px; height:10px;
      background:linear-gradient(180deg,#5d6d91 0%,#22395f 35%,#1b3159 100%);
    }
    #webamp #equalizer-window .equalizer-top::after {
      content:""; position:absolute; z-index:50; pointer-events:none;
      left:263px; top:3px; width:11px; height:9px;
      background:linear-gradient(180deg,#d3d9e5,#c0c9d8);
    }
    @media(max-width:570px),(max-height:520px) { :root { --player-scale:1.25; } }
    @media(max-width:360px),(max-height:350px) { :root { --player-scale:1; } }
  </style>
</head>
<body>
  <main id="player" aria-label="RADIO 001 live player"><div id="status" role="status" aria-live="polite"></div></main>
  <script src="./music-synth.js"></script>
  <script type="module" src="./webamp-radio.js"></script>
</body>
</html>
