<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>RADIO 001</title>
  <style>
    /* The website is the player. No replacement UI, upscaling, custom chrome, or decorations. */
    html, body { margin: 0; min-height: 100%; background: #000; }
    body { min-height: 100dvh; display: grid; place-items: center; overflow-x: hidden; }
    #player { position: relative; width: 275px; height: 116px; }
    #status { font: 11px Arial, sans-serif; color: #aaa; text-align: center; position: absolute; left: 0; right: 0; top: 132px; line-height: 1.4; }
    #status:empty { display: none; }
  </style>
</head>
<body>
  <main id="player" aria-label="RADIO 001 – classic Winamp player"><div id="status" role="status" aria-live="polite"></div></main>
  <script src="./music-synth.js"></script>
  <script type="module" src="./webamp-radio.js"></script>
</body>
</html>
